[project]
name = "dutyy-api"
version = "0.1.0"
description = "web-api for dutyy"
readme = "README.md"
authors = [{ name = "Oatmeal4Breakfast", email = "elvin.salcedo17@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.136.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "structlog>=25.5.0",
]

[tool.uv]
exclude-newer = "1 week"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.15.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (require a running database)",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
