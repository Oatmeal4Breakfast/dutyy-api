name: test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:18.4
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v1
        with:
          version: "latest"
      - name: Install Dependencies
        run: uv sync --locked

      - name: Run migrations
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5433
        run: uv run alembic upgrade head

      - name: Run Tests
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
