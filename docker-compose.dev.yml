---
services:
  db:
    image: postgres:18.4
    container_name: dutyy-dev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - "dutyy_db_data:/var/lib/postgresql"

  app:
    build: .
    container_name: dutyy-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      ENV: ${ENV}
    volumes:
      - ./src:/app/src
    depends_on:
      - db

volumes:
  dutyy_db_data:
